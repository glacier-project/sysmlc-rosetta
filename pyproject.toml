[project]
name = "sysmlc-rosetta"
version = "0.0.0"
description = "The rosetta backend for sysmlc: Lingua Franca reactors from SysML v2 state machines"
authors = [{ name = "Mario Libro", email = "mario.libro@univr.it" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "BSD-2-Clause"
dependencies = [
    "sysmlc",
    # Pinned to the certified release: newer syside rejects models the
    # corpora still use.
    "syside==0.8.6",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0,<2",
    "hatchling>=1.27,<2",
    "pre-commit>=4.5.1,<5",
    "pyrefly>=1.0.0",
    "pip-audit>=2.9.0,<3",
    "ruff>=0.15.13,<0.16",
    "tox>=4.50.1,<5",
    "tox-uv>=1.15,<2",
    "pytest>=8.4.2,<10",
    "pytest-cov>=6.3.0,<8",
    "sysmlc-models",
    # The inner-first and run-to-completion tests compare rosetta
    # against quake's sismic statecharts as a reference oracle.
    "sysmlc-quake",
]
docs = [
    "furo>=2024.8.6,<2027",
    "myst-parser>=3,<5",
    "sphinx>=7.4,<10",
    "sphinx-autobuild>=2024.10.3,<2027",
    "sphinx-autodoc-typehints>=2.2,<4",
    "sphinx-copybutton>=0.5,<1",
]

[project.entry-points."sysmlc.backends"]
rosetta = "sysmlc_rosetta.backend:RosettaBackend"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysmlc_rosetta"]

[tool.uv.sources]
sysmlc = { git = "https://github.com/glacier-project/sysmlc-core", branch = "dev" }
sysmlc-models = { git = "https://github.com/glacier-project/sysmlc-models", branch = "dev" }
sysmlc-quake = { git = "https://github.com/glacier-project/sysmlc-quake", branch = "dev" }

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
check-unannotated-defs = true
infer-return-types = "never"
project-includes = ["sysmlc_rosetta", "tests", "examples"]
# sismic ships no type information and arrives here through the quake
# oracle tests; yaml's stubs are likewise absent.
replace-imports-with-any = ["sismic", "sismic.*", "yaml"]

[tool.pyrefly.errors]
implicit-any = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
implicit-any-empty-container = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
missing-import = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-return = "error"
unnecessary-comparison = "error"
unreachable = "error"
unused-ignore = "error"
untyped-import = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-type-argument = "ignore"
implicit-any-empty-container = "ignore"

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_covered = true

[tool.ruff]
# Google style uses 80 chars
line-length = 80
target-version = "py312"

[tool.ruff.lint]
# Google Python Style Guide compliant rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "D",      # pydocstyle (docstring conventions)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID252", # flake8-tidy-imports: ban relative imports
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by Ruff)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # docstrings not required in tests
]

[tool.ruff.lint.flake8-tidy-imports]
# Ban ALL relative imports (the default is "parents")
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
# Google docstring convention
convention = "google"

[tool.ruff.lint.isort]
# Google style: absolute imports, sorted
known-first-party = ["sysmlc_rosetta"]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-m 'not lf'"
markers = [
    "lf: compile and run generated Lingua Franca programs (requires lfc + Java)",
]
