name: Set up Python and uv
description: Install the requested Python version and uv with dependency caching.
inputs:
  python-version:
    description: Python version to install.
    required: true
  git-repos-token:
    description: Token with read access to private glacier-project repositories, used to fetch git dependencies.
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: ${{ inputs.python-version }}
  - name: Install uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true
      cache-dependency-glob: uv.lock
  - name: Grant read access to private glacier-project git dependencies
    if: inputs.git-repos-token != ''
    shell: bash
    env:
      GIT_REPOS_TOKEN: ${{ inputs.git-repos-token }}
    run: |
      # Keep credentials in this job's environment on persistent runners.
      git_config_index=${GIT_CONFIG_COUNT:-0}
      {
        echo "GIT_CONFIG_COUNT=$((git_config_index + 1))"
        echo "GIT_CONFIG_KEY_${git_config_index}=url.https://x-access-token:${GIT_REPOS_TOKEN}@github.com/glacier-project/.insteadOf"
        echo "GIT_CONFIG_VALUE_${git_config_index}=https://github.com/glacier-project/"
      } >> "$GITHUB_ENV"
