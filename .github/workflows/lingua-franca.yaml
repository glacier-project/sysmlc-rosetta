name: Lingua Franca

on:
  push:
    branches:
    - main
    - dev
  pull_request:
    branches:
    - main
    - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  # End-to-end tests that compile and run generated Lingua Franca programs.
  # These need lfc + Java, which the other workflows do not install, so the
  # lf-marked tests run only here.
  lf:
    name: Compile and run LF programs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Lingua Franca Compiler
      run: |
        curl -Ls https://install.lf-lang.org | bash -s cli
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Verify lfc installation
      run: |
        which lfc
        lfc --version
    - uses: ./.github/actions/setup-python-uv
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        git-repos-token: ${{ secrets.GH_REPOS_READ_TOKEN }}
    - name: Run LF tests
      run: uv run --locked --extra dev tox run -e lf
