name: Lingua Franca

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  # End-to-end tests that compile and run generated Lingua Franca programs.
  # These need lfc + Java, which the other workflows do not install, so the
  # lf-marked tests run only here.
  lf:
    name: Compile and run LF programs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LF_VERSION: 0.13.0
      SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Lingua Franca Compiler
      run: |
        mkdir -p "$RUNNER_TEMP/lf-cli"
        curl -fL --retry 3 -o "$RUNNER_TEMP/lf-cli.tar.gz" \
          "https://github.com/lf-lang/lingua-franca/releases/download/v${LF_VERSION}/lf-cli-${LF_VERSION}-Linux-x86_64.tar.gz"
        tar -xzf "$RUNNER_TEMP/lf-cli.tar.gz" -C "$RUNNER_TEMP/lf-cli" --strip-components=1
        echo "$RUNNER_TEMP/lf-cli/bin" >> "$GITHUB_PATH"
    - name: Verify lfc version
      run: |
        lfc_version="$(lfc --version)"
        echo "$lfc_version"
        test "$lfc_version" = "lfc ${LF_VERSION}"
    - uses: ./.github/actions/setup-python-uv
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        git-repos-token: ${{ secrets.GH_REPOS_READ_TOKEN }}
    - name: Run LF tests
      run: uv run --locked --extra dev tox run -e lf
