name: Notify sysmlc to update

on:
  push:
    tags:
      - 'v*'

jobs:
  notify-sysmlc:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch submodule update to sysmlc
        env:
          GH_TOKEN: ${{ secrets.GH_REPOS_READ_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          branch=$(curl -sS -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/glacier-project/$REPO_NAME/commits/$COMMIT_SHA/branches-where-head" \
            | jq -r '.[0].name // "dev"')

          payload=$(jq -n \
            --arg sub "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg tag "$TAG_NAME" \
            --arg branch "$branch" \
            '{event_type: "submodule-updated", client_payload: {submodule: $sub, sha: $sha, tag: $tag, branch: $branch}}')

          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/glacier-project/sysmlc/dispatches \
            -d "$payload"
