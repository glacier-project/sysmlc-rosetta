[tox]
requires =
    tox>=4
    tox-uv>=1.15
env_list =
    py{312,313}
    formatter
    type
    coverage
    docs
skip_missing_interpreters = true

[testenv]
description = run the tests with pytest
runner = uv-venv-lock-runner
extras = dev
pass_env =
    SYSIDE_LICENSE_KEY
    SYSIDE_LICENSE_KEY_FILE
commands =
    {envpython} -m pytest {posargs:tests}

[testenv:lf]
description = compile and run generated Lingua Franca programs (needs lfc + Java)
runner = uv-venv-lock-runner
extras = dev
pass_env =
    SYSIDE_LICENSE_KEY
    SYSIDE_LICENSE_KEY_FILE
commands =
    {envpython} -m pytest -m lf {posargs:tests}

[testenv:type]
description = run type checks
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m pyrefly check {posargs}

[testenv:formatter]
description = run linter
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m ruff check --fix {posargs:sysmlc_rosetta tests examples docs/conf.py}
    {envpython} -m ruff format {posargs:sysmlc_rosetta tests examples docs/conf.py}

[testenv:coverage]
description = run coverage report
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m pytest --cov=sysmlc_rosetta --cov-report=term-missing --cov-report=xml {posargs:tests}

[testenv:security]
description = audit installed project dependencies for known vulnerabilities
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m pip_audit --progress-spinner off --skip-editable

[testenv:build]
description = build and smoke-test the distribution artifacts
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} scripts/validate_distribution.py

[testenv:docs]
description = build the documentation site
runner = uv-venv-lock-runner
extras = docs
commands =
    {envpython} -m sphinx -W --keep-going -b html docs docs/_build/html
